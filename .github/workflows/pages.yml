name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A push that lands while a deploy is running waits for it instead of cancelling it, so two
# sessions pushing close together no longer throw each other's deploy away. (GitHub keeps only the
# newest waiting run; main is linear, so that run already contains every earlier commit.)
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_AI_API_URL: ${{ vars.NEXT_PUBLIC_AI_API_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_ACCOUNTS_ENABLED: ${{ vars.NEXT_PUBLIC_ACCOUNTS_ENABLED }}
  NEXT_PUBLIC_PHONE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_PHONE_AUTH_ENABLED }}

jobs:
  # Quality checks run on their own machine, side by side with the site builds.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality check
        run: |
          npm run lint
          npm run quality:audit
          npm run quality:p0
          npm run quality:v21
          npm run quality:v22
          npm run quality:v23
          npm run quality:performance
          node scripts/audit-ai-worker.mjs
          npm run quality:ai
          npm run quality:ai-candidate
          node scripts/check-melodies.mjs
          node scripts/check-staff.mjs

  # Every site is built on its own machine at the same time, so a deploy takes about as long as the
  # slowest single site instead of all of them one after another.
  #   人音版 (/renyin/) and the entry page (yapu.studio/) come from the main app.
  #   The other editions are built from editions/<name> on top of the same code (scripts/build-edition.mjs).
  #   Repository variables take editions off the site: PUBLISH_RENJIAO (人教版 and 人教版五线谱),
  #   PUBLISH_STAFF (both 五线谱 editions), PUBLISH_XIANGYI (湘艺版) set to "false".
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - site: renyin
            enabled: "true"
          - site: renjiao
            enabled: ${{ vars.PUBLISH_RENJIAO != 'false' }}
          - site: renyin-staff
            enabled: ${{ vars.PUBLISH_STAFF != 'false' }}
          - site: renjiao-staff
            enabled: ${{ vars.PUBLISH_STAFF != 'false' && vars.PUBLISH_RENJIAO != 'false' }}
          - site: xiangyi
            enabled: ${{ vars.PUBLISH_XIANGYI != 'false' }}
    steps:
      - name: Checkout
        if: ${{ format('{0}', matrix.enabled) == 'true' }}
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: ${{ format('{0}', matrix.enabled) == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: ${{ format('{0}', matrix.enabled) == 'true' }}
        run: npm ci
      - name: Build 人音版 and entry page
        if: ${{ matrix.site == 'renyin' }}
        run: |
          npm run build
          node scripts/prepare-github-pages.mjs
          npm run quality:pages
        env:
          NEXT_PUBLIC_BASE_PATH: "/renyin"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
      - name: Build ${{ matrix.site }} edition
        if: ${{ matrix.site != 'renyin' && format('{0}', matrix.enabled) == 'true' }}
        run: node scripts/build-edition.mjs ${{ matrix.site }}
      - name: Keep the built site for the deploy
        if: ${{ format('{0}', matrix.enabled) == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: dist/client
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  # Put the sites side by side (yapu.studio/, /renyin/, /renjiao/, …) and hand them to Pages.
  assemble:
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - name: Collect the built sites
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: dist/client
          merge-multiple: true
      - name: List the sites
        run: ls -la dist/client && du -sh dist/client/*/ | sort -h
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
