<p>请回到芽谱找回密码页面，输入下面的 6 位验证码：</p>
<p style="font-family:monospace;font-size:32px;font-weight:bold;letter-spacing:6px;padding:16px;background:#edf7f1;border-radius:8px;text-align:center">{{ .Token }}</p>
